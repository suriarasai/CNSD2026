# otel/prometheus.yml
global:
  scrape_interval: 5s
  evaluation_interval: 15s

scrape_configs:
  - job_name: otel-collector
    static_configs:
      - targets: ["otel-collector:8889"]

  - job_name: caddy-gateway
    metrics_path: /metrics
    static_configs:
      - targets: ["gateway:2019"]

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
