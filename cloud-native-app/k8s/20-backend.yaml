apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: cnsd
spec:
  selector: { app: backend }
  ports:
    - name: http
      port: 3001
      targetPort: 3001
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: cnsd
spec:
  replicas: 1
  selector:
    matchLabels: { app: backend }
  template:
    metadata:
      labels: { app: backend }
    spec:
      terminationGracePeriodSeconds: 20
      containers:
        - name: backend
          image: localhost/cnsd-backend:lab   # loaded with `kind load image-archive`
          imagePullPolicy: IfNotPresent
          ports: [{ containerPort: 3001 }]
          env:
            - name: PORT
              value: "3001"
            - name: MONGO_URI
              value: "mongodb://mongodb:27017/taskdb"
            - name: VALKEY_URL
              value: "redis://valkey:6379"
            - name: RATING_URL
              value: "http://flaky:3002"
          # The HPA needs requests to compute utilisation percentages.
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits: { cpu: 500m, memory: 320Mi }
          livenessProbe:
            httpGet: { path: /healthz, port: 3001 }
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            httpGet: { path: /readyz, port: 3001 }
            initialDelaySeconds: 5
            periodSeconds: 5
          lifecycle:
            preStop:
              exec:
                command: ["sh", "-c", "sleep 5"]   # let endpoints propagate
