<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('TickIt · My Bookings')}"></head>
<body>
<header th:replace="~{fragments/layout :: nav}"></header>

<main>
    <h1>My Bookings</h1>

    <div class="alert ok"  th:if="${message}" th:text="${message}"></div>
    <div class="alert err" th:if="${error}"   th:text="${error}"></div>

    <form th:action="@{/bookings}" method="get" class="lookup">
        <input type="email" name="email" th:value="${email}" placeholder="Enter your email" required/>
        <button type="submit" class="btn">Look up</button>
    </form>

    <p th:if="${bookings != null and bookings.isEmpty()}" class="muted">No bookings for this email.</p>

    <table th:if="${bookings != null and !bookings.isEmpty()}">
        <thead>
        <tr><th>#</th><th>Event</th><th>Qty</th><th>Status</th><th>Booked at</th><th></th></tr>
        </thead>
        <tbody>
        <tr th:each="b : ${bookings}">
            <td th:text="${b.id}">1</td>
            <td th:text="${b.event.name}">Event</td>
            <td th:text="${b.quantity}">1</td>
            <td>
                <span class="badge" th:classappend="${b.status.name() == 'CANCELLED'} ? 'cancelled' : 'confirmed'"
                      th:text="${b.status}">CONFIRMED</span>
            </td>
            <td th:text="${#temporals.format(b.createdAt, 'dd MMM yyyy, HH:mm')}">date</td>
            <td>
                <form th:if="${b.status.name() == 'CONFIRMED'}"
                      th:action="@{/bookings/{id}/cancel(id=${b.id})}" method="post">
                    <input type="hidden" name="email" th:value="${email}"/>
                    <button type="submit" class="btn danger">Cancel</button>
                </form>
            </td>
        </tr>
        </tbody>
    </table>
</main>
</body>
</html>
