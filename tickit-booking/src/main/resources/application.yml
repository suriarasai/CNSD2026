spring:
  application:
    name: tickit-booking

  # Factor III (Config) + Factor IV (Backing services): the database is an
  # attached resource reached purely through env-injected connection settings.
  # The defaults below are convenience values for local dev only; real
  # credentials are injected from the git-ignored .env via the container env.
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/tickit}
    username: ${SPRING_DATASOURCE_USERNAME:tickit}
    password: ${SPRING_DATASOURCE_PASSWORD:tickit}

  jpa:
    hibernate:
      # Flyway owns the schema; Hibernate only validates against it (Factor X parity).
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  # Factor XII (Admin processes): migrations run automatically at boot.
  flyway:
    enabled: true
    locations: classpath:db/migration

  thymeleaf:
    cache: false

server:
  port: 8080
  # Factor IX (Disposability): drain in-flight requests on SIGTERM.
  shutdown: graceful

# Factor IX: health endpoint backs the container/compose health checks.
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

# Factor XI (Logs): default Logback writes to stdout; no file appenders.
logging:
  level:
    com.stc.tickit: INFO
