apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: redis-data-pvc
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 500Mi
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: nginx-config
data:
  nginx.conf: |
    events {}
    http {
      server {
        listen 80;
        location /api/ {
          proxy_pass http://127.0.0.1:3000;
        }
        location / {
          return 200 '{"message": "Gateway ready via Podman Kube Play"}';
          add_header Content-Type application/json;
        }
      }
    }
---
apiVersion: v1
kind: Pod
metadata:
  name: app-tier-pod
  labels:
    app: 3tier-system
spec:
  restartPolicy: Always
  volumes:
    - name: redis-storage
      persistentVolumeClaim:
        claimName: redis-data-pvc
    - name: proxy-cm
      configMap:
        name: nginx-config
  containers:
    - name: cache
      image: docker.io/library/redis:7-alpine
      command: ["redis-server", "--appendonly", "yes"]
      volumeMounts:
        - mountPath: /data
          name: redis-storage

    - name: backend
      image: localhost/backend:latest
      env:
        - name: REDIS_HOST
          value: "127.0.0.1"
        - name: REDIS_PORT
          value: "6379"
        - name: PORT
          value: "3000"

    - name: proxy
      image: docker.io/library/nginx:alpine
      ports:
        - containerPort: 80
          hostPort: 8080
      volumeMounts:
        - mountPath: /etc/nginx/nginx.conf
          subPath: nginx.conf
          name: proxy-cm